<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Revisit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: dark ink rail + light content canvas. Login gate first, then a 7-section console.
   Display serif carries the brand and every headline number; everything else is quiet UI sans. */
:root{
  --bg:#F7F6F1; --surface:#FFFFFF; --surface-2:#F1F0EA; --surface-3:#FAF9F5;
  --ink:#171D1A; --ink-2:#5B6562; --ink-3:#919996; --line:#E6E3DA; --line-2:#EFEDE5;
  --accent:#0A6B55; --accent-2:#0E8469; --accent-soft:#E2EEE9; --accent-ink:#065040; --on-accent:#FFFFFF;
  --gold:#8A6B1D; --gold-soft:#F4EEDC;
  --warn:#A4600F; --warn-soft:#F8EDDC;
  --alert:#9B3A34; --alert-soft:#F8E6E3;
  --info:#2F5495; --info-soft:#E6EBF6;
  --chart-1:#00785E; --chart-2:#C2651F;
  --rail:#121D19; --rail-2:#1C2D27; --rail-3:#274037; --rail-ink:#E4EBE8; --rail-ink-2:#8DA49C;
  --shadow:0 1px 2px rgba(23,29,26,.04), 0 8px 24px -16px rgba(23,29,26,.22);
  --shadow-lg:0 24px 60px -24px rgba(23,29,26,.4);
  --r:16px;
  --fd:"Instrument Serif","Songti SC","Noto Serif CJK SC",Georgia,serif;
  --fu:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111514; --surface:#191E1D; --surface-2:#232927; --surface-3:#1E2423;
  --ink:#E9EDEB; --ink-2:#A3ADA9; --ink-3:#7A8481; --line:#2A312F; --line-2:#242A28;
  --accent:#3FB893; --accent-2:#52CAA5; --accent-soft:#143229; --accent-ink:#6FD7B4; --on-accent:#08201A;
  --gold:#C6A552; --gold-soft:#2D2614;
  --warn:#D2964C; --warn-soft:#322615;
  --alert:#DD827C; --alert-soft:#33201E;
  --info:#8AA6DF; --info-soft:#1B2334;
  --chart-1:#27A381; --chart-2:#CE7D33;
  --rail:#0C1412; --rail-2:#17221E; --rail-3:#223229; --rail-ink:#E4EBE8; --rail-ink-2:#85978F;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
  --shadow-lg:0 24px 60px -24px rgba(0,0,0,.9);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111514; --surface:#191E1D; --surface-2:#232927; --surface-3:#1E2423;
  --ink:#E9EDEB; --ink-2:#A3ADA9; --ink-3:#7A8481; --line:#2A312F; --line-2:#242A28;
  --accent:#3FB893; --accent-2:#52CAA5; --accent-soft:#143229; --accent-ink:#6FD7B4; --on-accent:#08201A;
  --gold:#C6A552; --gold-soft:#2D2614;
  --warn:#D2964C; --warn-soft:#322615;
  --alert:#DD827C; --alert-soft:#33201E;
  --info:#8AA6DF; --info-soft:#1B2334;
  --chart-1:#27A381; --chart-2:#CE7D33;
  --rail:#0C1412; --rail-2:#17221E; --rail-3:#223229; --rail-ink:#E4EBE8; --rail-ink-2:#85978F;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
  --shadow-lg:0 24px 60px -24px rgba(0,0,0,.9);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--fu);font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0;text-wrap:balance}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ============ LOGIN ============ */
.login{min-height:100svh;display:flex;flex-direction:column;background:var(--rail);color:var(--rail-ink);
  padding:clamp(20px,5vw,48px) clamp(16px,5vw,48px);position:relative;overflow:hidden}
.login::after{content:"";position:absolute;width:640px;height:640px;right:-200px;top:-260px;border-radius:50%;
  background:radial-gradient(circle,rgba(63,184,147,.16),transparent 68%);pointer-events:none}
.login .top{display:flex;justify-content:space-between;align-items:center;gap:12px;position:relative;z-index:1}
.login .mid{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:0;
  padding-block:40px;position:relative;z-index:1}
.wordmark{font-family:var(--fd);font-size:clamp(52px,11vw,86px);line-height:1;letter-spacing:-.01em}
.wordmark em{font-style:italic;color:var(--accent-2)}
.login .tag{color:var(--rail-ink-2);font-size:14px;letter-spacing:.14em;margin-top:14px;text-transform:uppercase}
.login .ask{margin-top:48px;margin-bottom:18px;font-size:14.5px;color:var(--rail-ink-2)}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:14px;width:100%;max-width:700px}
.rolecard{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1);border-radius:var(--r);
  padding:20px 18px;text-align:left;color:var(--rail-ink);transition:transform .16s,border-color .16s,background .16s}
.rolecard:hover{background:rgba(255,255,255,.08);border-color:var(--accent-2);transform:translateY(-3px)}
.rolecard .ri{width:34px;height:34px;border-radius:10px;background:var(--rail-3);display:grid;place-items:center;margin-bottom:13px}
.rolecard .ri svg{width:17px;height:17px;stroke:var(--accent-2);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rolecard h3{font-size:16.5px;font-weight:600;margin-bottom:4px}
.rolecard p{font-size:12.5px;color:var(--rail-ink-2);line-height:1.6}
.login .fine{margin-top:26px;font-size:12px;color:var(--rail-ink-2);text-align:center}
.login .bottom{position:relative;z-index:1;font-size:11.5px;color:var(--rail-ink-2);display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}
.lang{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:5px 12px;
  font-size:12px;color:var(--rail-ink);letter-spacing:.04em}
.lang:hover{border-color:var(--accent-2)}

/* ============ SHELL ============ */
.app{display:grid;grid-template-columns:238px minmax(0,1fr);min-height:100svh}
.rail{background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;gap:22px;
  padding:22px 16px calc(18px + env(safe-area-inset-bottom,0px));
  padding-top:calc(22px + env(safe-area-inset-top,0px));
  position:sticky;top:0;height:100svh;overflow-y:auto}
.rmark{display:flex;align-items:baseline;gap:9px}
.rmark .w{font-family:var(--fd);font-size:27px;line-height:1}
.rmark .w em{font-style:italic;color:var(--accent-2)}
.rmark .v{font-size:10px;color:var(--rail-ink-2);letter-spacing:.1em}
.rclinic{font-size:12px;color:var(--rail-ink-2);margin-top:5px;overflow-wrap:anywhere}
.rolebox{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:10px 12px}
.rolebox .lb{font-size:10px;letter-spacing:.1em;color:var(--rail-ink-2);text-transform:uppercase}
.rolesel{width:100%;background:transparent;border:0;color:var(--rail-ink);font-size:14px;font-weight:600;padding:3px 0 0;cursor:pointer}
.rolesel option{color:#111;background:#fff}
nav{display:flex;flex-direction:column;gap:2px;flex:1;min-height:0}
.nb{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;
  padding:9px 11px;border-radius:10px;color:var(--rail-ink-2);font-size:13.5px;white-space:nowrap}
.nb:hover{background:var(--rail-2);color:var(--rail-ink)}
.nb[aria-selected="true"]{background:var(--rail-3);color:#fff;font-weight:600}
.nb .ic{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nb .bdg{margin-left:auto;background:var(--alert);color:#fff;font-size:10.5px;font-weight:700;border-radius:999px;padding:0 6px;line-height:17px}
.rtools{display:flex;flex-direction:column;gap:4px;border-top:1px solid rgba(255,255,255,.08);padding-top:12px}
.rt{display:flex;align-items:center;gap:9px;background:none;border:0;padding:7px 11px;border-radius:9px;
  color:var(--rail-ink-2);font-size:12.5px;text-align:left;width:100%}
.rt:hover{background:var(--rail-2);color:var(--rail-ink)}
.rt .ic{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rfoot{font-size:10.5px;color:var(--rail-ink-2);line-height:1.75;border-top:1px solid rgba(255,255,255,.08);padding-top:12px}
.rfoot b{color:var(--rail-ink);font-weight:600}

.main{min-width:0;padding:clamp(20px,2.6vw,34px) clamp(16px,2.6vw,36px) 56px;display:flex;flex-direction:column}
.view{display:flex;flex-direction:column;gap:18px;min-width:0}
.vh{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:2px}
.vh h1{font-family:var(--fd);font-size:clamp(26px,3.3vw,34px);line-height:1.15;letter-spacing:-.01em}
.vh .sub{margin-top:5px;color:var(--ink-2);font-size:13.5px;max-width:64ch}
.vh .right{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stamp{font-size:12px;color:var(--ink-3);white-space:nowrap}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;flex-direction:column;gap:14px}
  nav{flex-direction:row;overflow-x:auto;gap:6px;flex:none}
  .nb{width:auto;flex:none;background:var(--rail-2);padding:7px 13px}
  .nb .ic{display:none}
  .rtools{flex-direction:row;flex-wrap:wrap}
  .rt{width:auto;background:var(--rail-2)}
  .rfoot{display:none}
  .main{padding-bottom:40px}
}

/* ============ PRIMITIVES ============ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card>.ch{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;padding:16px 18px 0}
.card>.ch h2{font-size:14.5px;font-weight:600;letter-spacing:.01em}
.card>.ch .hint{font-size:12px;color:var(--ink-3)}
.card>.cb{padding:14px 18px 18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g2a{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.g2b{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)}
@media (max-width:980px){.g2a,.g2b{grid-template-columns:minmax(0,1fr)}}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px;
  display:flex;flex-direction:column;gap:3px;box-shadow:var(--shadow);text-align:left;width:100%}
.tile:hover{border-color:var(--accent)}
.tile .lb{font-size:12px;color:var(--ink-2)}
.tile .vv{font-family:var(--fd);font-size:40px;line-height:1.08;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tile .ft{font-size:11.5px;color:var(--ink-3)}
.tile.flag{border-color:var(--alert);background:var(--alert-soft)}
.tile.flag .vv,.tile.flag .lb{color:var(--alert)}
.tile.flag .ft{color:var(--alert);opacity:.8}

.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;padding:9px 15px;font-size:13.5px;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--accent-2)}
.btn:disabled{opacity:.42;cursor:not-allowed;background:var(--accent)}
.btn.sec{background:var(--surface-2);color:var(--ink-2);font-weight:500}
.btn.sec:hover{background:var(--accent-soft);color:var(--accent-ink)}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:8px}
.btn.blk{width:100%}
.btn.dim{background:transparent;border:1px solid var(--line);color:var(--ink-2);font-weight:500}
.btn.dim:hover{border-color:var(--accent);color:var(--accent-ink);background:transparent}

.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.c-new{background:var(--info-soft);color:var(--info)}
.c-act{background:var(--accent-soft);color:var(--accent-ink)}
.c-lap{background:var(--warn-soft);color:var(--warn)}
.c-dor{background:var(--alert-soft);color:var(--alert)}
.c-vip{background:var(--gold-soft);color:var(--gold);margin-left:5px}
.c-neu{background:var(--surface-2);color:var(--ink-2)}
.c-ok{background:var(--accent-soft);color:var(--accent-ink)}

.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{background:none;border:0;border-radius:8px;padding:6px 13px;font-size:12.5px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.fb{background:var(--surface-2);border:1px solid transparent;border-radius:999px;padding:5px 13px;font-size:12.5px;color:var(--ink-2)}
.fb:hover{color:var(--ink)}
.fb[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.srch{flex:1;min-width:132px;background:var(--surface-3);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:13px}

.tw{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:13px}
.tw.snug table{min-width:0}
.tw.mid table{min-width:440px}
thead th{position:sticky;top:0;background:var(--surface-2);color:var(--ink-2);font-weight:600;font-size:11px;
  letter-spacing:.06em;text-transform:uppercase;text-align:left;padding:9px 13px;white-space:nowrap;
  border-bottom:1px solid var(--line);z-index:1}
thead th.srt{cursor:pointer;user-select:none}
thead th.srt:hover{color:var(--ink)}
tbody td{padding:10px 13px;border-bottom:1px solid var(--line-2);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr.ck{cursor:pointer}
tbody tr:hover td{background:var(--surface-3)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.scr{max-height:424px;overflow-y:auto}
.empty{color:var(--ink-3);text-align:center;padding:30px 12px}
input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;vertical-align:-2px}
.ckc{width:38px}

.note{font-size:12px;color:var(--ink-3);margin-top:9px;line-height:1.7}
.ta{width:100%;background:var(--surface-3);border:1px solid var(--line);border-radius:12px;padding:12px 13px;
  font-size:13px;line-height:1.8;resize:vertical;min-height:122px;font-family:var(--fu)}
.inp{background:var(--surface-3);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13.5px;width:100%}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12px;color:var(--ink-2)}
.gg2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:420px){.gg2{grid-template-columns:1fr}}
.rowb{display:flex;gap:10px;margin-top:6px}
.rowb>*{flex:1}

/* todo + alerts */
.todo{display:flex;flex-direction:column}
.ti{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2)}
.ti:last-child{border-bottom:0}
.ti .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--accent)}
.ti .dot.w{background:var(--warn)} .ti .dot.a{background:var(--alert)}
.ti .tx{flex:1;min-width:0;font-size:13.5px}
.ti .tx b{font-weight:600}
.ti .tx small{display:block;color:var(--ink-3);font-size:11.5px;margin-top:1px}
.ti.done .tx{text-decoration:line-through;color:var(--ink-3)}
.ti.done .dot{background:var(--ink-3)}
.alerts{display:flex;flex-direction:column;gap:10px}
.al{display:flex;gap:11px;align-items:flex-start;background:var(--surface-3);border:1px solid var(--line);
  border-left:3px solid var(--warn);border-radius:0 12px 12px 0;padding:12px 14px}
.al.a{border-left-color:var(--alert)} .al.g{border-left-color:var(--accent)}
.al .tx{flex:1;min-width:0;font-size:13px;color:var(--ink-2)}
.al .tx b{color:var(--ink);display:block;font-size:13.5px;margin-bottom:2px}

.dist{display:flex;gap:3px;height:30px;border-radius:9px;overflow:hidden;margin-bottom:12px}
.dist span{display:block}
.dkey{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink-2)}
.dkey button{background:none;border:0;padding:0;color:inherit;font-size:inherit}
.dkey button:hover{color:var(--accent-ink)}
.dkey i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px}
.feed{display:flex;flex-direction:column}
.fi{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--line-2);font-size:12.5px}
.fi:last-child{border-bottom:0}
.fd{width:7px;height:7px;border-radius:50%;margin-top:7px;flex:none;background:var(--accent)}
.fd.w{background:var(--warn)} .fd.i{background:var(--info)}
.fi .tx{color:var(--ink-2);min-width:0}
.fi .tx b{color:var(--ink);font-weight:600}
.fi .ago{margin-left:auto;color:var(--ink-3);font-size:11.5px;white-space:nowrap;flex:none}
.mstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:12px;margin-top:16px;
  border-top:1px solid var(--line-2);padding-top:14px}
.ms{display:flex;flex-direction:column;gap:1px;min-width:0}
.ms .k{font-size:11.5px;color:var(--ink-3);line-height:1.4}
.ms .v{font-family:var(--fd);font-size:23px;line-height:1.15}
.grid.g2b>.card,.grid.g2a>.card{align-self:start}
/* calendar */
.week{display:grid;grid-template-columns:repeat(7,minmax(126px,1fr));gap:9px;overflow-x:auto;padding-bottom:6px}
.day{background:var(--surface-3);border:1px solid var(--line);border-radius:13px;padding:10px;min-height:206px;
  display:flex;flex-direction:column;gap:7px}
.day.today{border-color:var(--accent);background:var(--accent-soft)}
.day h3{font-size:11.5px;color:var(--ink-2);display:flex;justify-content:space-between;align-items:baseline;gap:4px;font-weight:600}
.day h3 em{font-style:normal;font-size:10.5px;color:var(--ink-3);font-weight:400}
.ap{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:9px;
  padding:7px 9px;font-size:12px;display:flex;flex-direction:column;gap:1px;text-align:left;width:100%}
.ap:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.ap.pend{border-left-color:var(--warn)}
.ap.done{opacity:.5;border-left-color:var(--ink-3)}
.ap.canc{opacity:.45;border-left-color:var(--alert)}
.ap.canc .nm{text-decoration:line-through}
.ap .t{font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:11px}
.ap .nm{font-weight:600}
.ap .w{font-size:10.5px;color:var(--ink-3)}
.memo{margin-top:auto;background:transparent;border:1px dashed var(--line);border-radius:8px;padding:5px 7px;
  font-size:11px;color:var(--ink-2);width:100%;resize:none;min-height:34px;font-family:var(--fu)}
.memo:focus{border-style:solid;border-color:var(--accent);background:var(--surface)}
.lgd{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:11.5px;color:var(--ink-3);margin-top:12px;align-items:center}
.lgd i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:baseline}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(14,20,18,.55);z-index:55;backdrop-filter:blur(2px)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(100%,452px);background:var(--surface);
  border-left:1px solid var(--line);box-shadow:var(--shadow-lg);z-index:60;overflow-y:auto;
  padding:0 0 calc(26px + env(safe-area-inset-bottom,0px))}
.dtop{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);z-index:2;
  padding:calc(20px + env(safe-area-inset-top,0px)) 22px 0}
.dhd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.dhd h2{font-family:var(--fd);font-size:27px;line-height:1.15}
.dhd .meta{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.xb{background:var(--surface-2);border:0;width:30px;height:30px;border-radius:9px;color:var(--ink-2);font-size:15px;line-height:1;flex:none}
.xb:hover{background:var(--accent-soft);color:var(--accent-ink)}
.dtabs{display:flex;gap:2px;margin-top:14px;overflow-x:auto}
.dtabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 11px;font-size:13px;
  color:var(--ink-3);white-space:nowrap}
.dtabs button[aria-selected="true"]{color:var(--accent-ink);border-bottom-color:var(--accent);font-weight:600}
.dbody{padding:18px 22px 0}
.dsec{margin-bottom:20px}
.dsec h3{font-size:11px;letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase;margin-bottom:9px}
.kv{display:grid;grid-template-columns:82px minmax(0,1fr);gap:7px 12px;font-size:13px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;overflow-wrap:anywhere}
.tl{display:flex;flex-direction:column;border-left:2px solid var(--line);padding-left:15px;margin-left:5px}
.tl div{position:relative;padding:6px 0;font-size:12.5px;color:var(--ink-2)}
.tl div::before{content:"";position:absolute;left:-20px;top:13px;width:7px;height:7px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 0 3px var(--surface)}
.tl div b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
.tagrow{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.tagx{background:var(--surface-2);border:0;border-radius:999px;padding:3px 10px;font-size:11.5px;color:var(--ink-2)}
.tagx:hover{background:var(--alert-soft);color:var(--alert)}
.cns{display:flex;flex-direction:column;gap:9px}
.cnr{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;
  background:var(--surface-3);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.sw{position:relative;width:38px;height:21px;flex:none;background:var(--surface-2);border:1px solid var(--line);
  border-radius:999px;transition:background .18s,border-color .18s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--ink-3);transition:transform .18s,background .18s}
.sw[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(17px);background:#fff}
.sw:disabled{opacity:.45;cursor:not-allowed}
.pkg{background:var(--surface-3);border:1px solid var(--line);border-radius:12px;padding:14px}
.pkgbar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin:9px 0 7px}
.pkgbar span{display:block;height:100%;background:var(--accent);border-radius:999px}
.dact{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:13px 22px;
  display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.dact .btn{flex:1;min-width:104px}

/* rules + compliance */
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(262px,1fr));gap:14px}
.rule{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 16px;
  display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);text-align:left}
.rule.off{opacity:.6}
.rule .tp{display:flex;align-items:center;justify-content:space-between;gap:9px}
.rule .nm{font-size:14px;font-weight:600}
.rule .mt{font-size:12.5px;color:var(--ink-2);line-height:1.75}
.rule .st{font-size:11.5px;color:var(--ink-3);border-top:1px dashed var(--line);padding-top:8px;margin-top:2px}
.rule .st b{color:var(--ink-2)}
.cmp{display:flex;flex-direction:column;gap:8px}
.cmpr{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink-2)}
.cmpr .mk{flex:none;width:17px;height:17px;border-radius:50%;display:grid;place-items:center;font-size:10px;margin-top:2px}
.cmpr.ok .mk{background:var(--accent-soft);color:var(--accent-ink)}
.cmpr.no .mk{background:var(--warn-soft);color:var(--warn)}

/* reviews */
.rvs{display:flex;flex-direction:column;gap:12px}
.rv{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 16px;box-shadow:var(--shadow)}
.rv.low{border-left:3px solid var(--alert)}
.rvh{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:7px}
.stars{color:var(--gold);letter-spacing:2px;font-size:14px}
.stars .off{color:var(--ink-3);opacity:.45}
.rv p.body{font-size:13.5px;color:var(--ink-2);line-height:1.8}
.rvrep{background:var(--surface-3);border-left:2px solid var(--accent);border-radius:0 10px 10px 0;
  padding:9px 12px;margin-top:10px;font-size:12.5px;color:var(--ink-2)}
.rvrep b{color:var(--ink)}

/* charts */
.hb{display:flex;flex-direction:column;gap:10px}
.hbr{display:grid;grid-template-columns:82px minmax(0,1fr) 46px;align-items:center;gap:11px;font-size:12.5px}
.hbr .tk{display:block;background:var(--surface-2);border-radius:5px;height:17px;overflow:hidden}
.hbr .fl{display:block;height:100%;background:var(--chart-1);border-radius:0 5px 5px 0;transition:width .5s ease}
.hbr .vv{text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}
.grp{display:flex;align-items:flex-end;gap:clamp(5px,1.8vw,15px);height:184px;padding-top:6px;border-bottom:1px solid var(--line)}
.gc{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%;min-width:0}
.gp{display:flex;align-items:flex-end;gap:2px;width:100%;flex:1 1 auto;min-height:0;justify-content:center}
.gb{width:clamp(8px,3vw,18px);border-radius:4px 4px 0 0;transition:height .5s ease}
.gb.s1{background:var(--chart-1)} .gb.s2{background:var(--chart-2)}
.gv{font-size:10.5px;line-height:1;color:var(--ink-3);font-variant-numeric:tabular-nums}
.gv.hi{color:var(--ink);font-weight:700}
.gax{display:flex;gap:clamp(5px,1.8vw,15px);margin-top:8px}
.gax span{flex:1;text-align:center;font-size:11px;color:var(--ink-3)}
.lg{display:flex;flex-wrap:wrap;gap:15px;font-size:12px;color:var(--ink-2);margin-bottom:12px}
.lg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px}
.fun{display:flex;flex-direction:column;gap:9px}
.fnr{display:grid;grid-template-columns:96px minmax(0,1fr) 78px;align-items:center;gap:11px;font-size:12.5px}
.fnr .tk{display:block;background:var(--surface-2);border-radius:6px;height:26px;overflow:hidden}
.fnr .fl{display:flex;align-items:center;justify-content:flex-end;height:100%;background:var(--chart-1);
  border-radius:0 6px 6px 0;padding-right:9px;color:#fff;font-size:11.5px;font-weight:600;transition:width .5s}
.fnr .rt{text-align:right;color:var(--ink-3);font-variant-numeric:tabular-nums;font-size:11.5px}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:5px 10px;
  border-radius:8px;white-space:nowrap;z-index:70;opacity:0;transition:opacity .12s;font-variant-numeric:tabular-nums}
.tip.on{opacity:1}
.tak{background:var(--surface-3);border-left:3px solid var(--accent);border-radius:0 12px 12px 0;
  padding:13px 16px;font-size:13px;color:var(--ink-2);line-height:1.8}
.tak b{color:var(--ink)}

/* modal + toast */
.sheet{position:fixed;inset:0;background:rgba(14,20,18,.55);display:grid;place-items:center;padding:16px;z-index:65;backdrop-filter:blur(2px)}
.sheet>div{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;
  width:min(100%,460px);box-shadow:var(--shadow-lg);max-height:88svh;overflow-y:auto}
.sheet h2{font-family:var(--fd);font-size:24px;line-height:1.2;margin-bottom:6px}
.sheet .lead{color:var(--ink-2);font-size:13px;margin-bottom:16px;line-height:1.75}
.sheet.wide>div{width:min(100%,560px)}
.mhd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:6px}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--warn-soft);color:var(--warn);
  font-size:11px;font-weight:700;letter-spacing:.05em;padding:3px 9px;border-radius:999px}
.badge::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.abgrid{display:grid;gap:10px;margin:4px 0 16px}
.abr{display:flex;gap:11px;font-size:13px;color:var(--ink-2);line-height:1.7}
.abr .n{font-family:var(--fd);font-size:16px;color:var(--accent);line-height:1.3;flex:none;width:19px}
.abr b{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;z-index:80;
  opacity:0;transition:opacity .2s;pointer-events:none;max-width:88vw;text-align:center}
.toast.on{opacity:1}
.pv{background:var(--surface-3);border:1px solid var(--line);border-radius:12px;padding:13px 14px;
  white-space:pre-wrap;font-size:13px;line-height:1.85;color:var(--ink);text-align:left}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<!-- ================= LOGIN ================= -->
<div class="login" id="login">
  <div class="top">
    <span class="badge" data-t="demoTag"></span>
    <button class="lang" id="langLogin">中文 / EN</button>
  </div>
  <div class="mid">
    <div class="wordmark">Re<em>visit</em></div>
    <div class="tag" data-t="brandSub"></div>
    <div class="ask" data-t="loginAsk"></div>
    <div class="roles" id="roleCards"></div>
    <div class="fine" data-t="loginFine"></div>
  </div>
  <div class="bottom">
    <span data-t="footLegal"></span>
    <span data-t="footBy"></span>
  </div>
</div>

<!-- ================= APP ================= -->
<div class="app" id="app" hidden>
  <aside class="rail">
    <div>
      <div class="rmark"><span class="w">Re<em>visit</em></span><span class="v">v1.0</span></div>
      <div class="rclinic" id="railClinic"></div>
    </div>

    <div class="rolebox">
      <div class="lb" data-t="roleLabel"></div>
      <select class="rolesel" id="roleSel" aria-label="role"></select>
    </div>

    <nav id="nav" role="tablist"></nav>

    <div class="rtools">
      <button class="rt" id="btnAbout"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.6v.2"/></svg><span data-t="about"></span></button>
      <button class="rt" id="btnLang"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3.5 9h17M3.5 15h17M12 3a16 16 0 0 1 0 18A16 16 0 0 1 12 3z"/></svg><span>中文 / English</span></button>
      <button class="rt" id="btnSet"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 14.5a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-2.7-1.1l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.1-2.7l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 2.7-1.1V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg><span data-t="setTitle"></span></button>
      <button class="rt" id="btnTheme"><svg class="ic" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg><span data-t="theme"></span></button>
      <button class="rt" id="btnReset"><svg class="ic" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 1 2.5 5.8"/><path d="M4 18v-5h5"/></svg><span data-t="reset"></span></button>
      <button class="rt" id="btnExit"><svg class="ic" viewBox="0 0 24 24"><path d="M14 4h4a1.5 1.5 0 0 1 1.5 1.5v13A1.5 1.5 0 0 1 18 20h-4M10 16l-4-4 4-4M6.5 12H15"/></svg><span data-t="exit"></span></button>
    </div>

    <div class="rfoot"><b>Revisit</b> · <span data-t="footByShort"></span><br><span data-t="footRepo"></span></div>
  </aside>

  <main class="main">
    <!-- ===== 总览 ===== -->
    <section class="view" id="v-ov" hidden>
      <div class="vh">
        <div><h1 data-t="ovTitle"></h1><p class="sub" data-t="ovSub"></p></div>
        <span class="stamp" id="ovStamp"></span>
      </div>
      <div class="tiles" id="ovTiles"></div>
      <div class="grid g2a">
        <div class="card"><div class="ch"><h2 data-t="todoTitle"></h2><span class="hint" id="todoLeft"></span></div>
          <div class="cb"><div class="todo" id="todoList"></div></div></div>
        <div class="card"><div class="ch"><h2 data-t="alertTitle"></h2><span class="hint" data-t="alertHint"></span></div>
          <div class="cb"><div class="alerts" id="alertList"></div></div></div>
      </div>
      <div class="grid g2b">
        <div class="card"><div class="ch"><h2 data-t="distTitle"></h2><span class="hint" data-t="distHint"></span></div>
          <div class="cb"><div class="dist" id="distBar"></div><div class="dkey" id="distKey"></div><div class="mstats" id="distMini"></div></div></div>
        <div class="card"><div class="ch"><h2 data-t="todayTitle"></h2><span class="hint" data-t="todayHint"></span></div>
          <div class="cb"><div class="tw snug"><table id="tTodayAp"><thead></thead><tbody></tbody></table></div></div></div>
      </div>
      <div class="card"><div class="ch"><h2 data-t="feedTitle"></h2><span class="hint" data-t="feedHint"></span></div>
        <div class="cb"><div class="feed" id="feedList"></div></div></div>
    </section>

    <!-- ===== 预约 ===== -->
    <section class="view" id="v-ap" hidden>
      <div class="vh">
        <div><h1 data-t="apTitle"></h1><p class="sub" data-t="apSub"></p></div>
        <div class="right">
          <select class="inp" id="docFilter" style="width:auto" aria-label="doctor"></select>
          <button class="btn" id="btnNewAppt"></button>
        </div>
      </div>
      <div class="card"><div class="cb">
        <div class="week" id="week"></div>
        <div class="lgd" id="apLegend"></div>
      </div></div>
    </section>

    <!-- ===== 客户 ===== -->
    <section class="view" id="v-cl" hidden>
      <div class="vh">
        <div><h1 data-t="clTitle"></h1><p class="sub" data-t="clSub"></p></div>
        <span class="stamp" id="clCount"></span>
      </div>
      <div class="card"><div class="cb">
        <div class="filters" id="clFilters"></div>
        <div class="filters" id="clBulk" hidden></div>
        <div class="tw scr"><table id="tClients"><thead></thead><tbody></tbody></table></div>
        <p class="note" data-t="clNote"></p>
      </div></div>
    </section>

    <!-- ===== 召回 ===== -->
    <section class="view" id="v-rc" hidden>
      <div class="vh">
        <div><h1 data-t="rcTitle"></h1><p class="sub" data-t="rcSub"></p></div>
      </div>
      <div class="grid g2a">
        <div class="card"><div class="cb">
          <div class="filters"><div class="seg" id="rcChan"></div></div>
          <div class="filters" id="rcSeg"></div>
          <div class="tak" id="rcStats" style="margin-bottom:14px"></div>
          <div class="tw mid scr"><table id="tRecall"><thead></thead><tbody></tbody></table></div>
        </div></div>
        <div class="card"><div class="cb">
          <h2 style="font-size:14.5px;font-weight:600;margin-bottom:10px" id="rcTplTitle"></h2>
          <textarea class="ta" id="rcMsg" aria-label="message"></textarea>
          <p class="note" data-t="rcTplNote"></p>
          <div class="tak" id="rcEst" style="margin-top:12px"></div>
          <div class="rowb"><button class="btn sec" id="btnPreview"></button><button class="btn" id="btnSend"></button></div>
          <p class="note" id="rcQuiet"></p>
        </div></div>
      </div>
    </section>

    <!-- ===== 自动化 ===== -->
    <section class="view" id="v-au" hidden>
      <div class="vh">
        <div><h1 data-t="auTitle"></h1><p class="sub" data-t="auSub"></p></div>
        <span class="stamp" id="auStamp"></span>
      </div>
      <div class="card"><div class="ch"><h2 data-t="cmpTitle"></h2><span class="hint" data-t="cmpHint"></span></div>
        <div class="cb"><div class="cmp" id="cmpList"></div></div></div>
      <div class="rules" id="rulesGrid"></div>
      <div class="card"><div class="ch"><h2 data-t="blastTitle"></h2><span class="hint" data-t="blastHint"></span></div>
        <div class="cb">
          <div class="filters" id="blFilters"></div>
          <textarea class="ta" id="blMsg" aria-label="campaign"></textarea>
          <div class="rowb" style="align-items:center">
            <span class="note" style="margin:0" id="blCount"></span>
            <button class="btn" id="btnBlast" style="flex:0 0 auto"></button>
          </div>
        </div></div>
    </section>

    <!-- ===== 评价 ===== -->
    <section class="view" id="v-rv" hidden>
      <div class="vh">
        <div><h1 data-t="rvTitle"></h1><p class="sub" data-t="rvSub"></p></div>
        <button class="btn" id="btnInvite"></button>
      </div>
      <div class="tiles" id="rvTiles"></div>
      <div class="card"><div class="cb">
        <div class="filters" id="rvFilters"></div>
        <div class="rvs" id="rvList"></div>
      </div></div>
    </section>

    <!-- ===== 报表 ===== -->
    <section class="view" id="v-rp" hidden>
      <div class="vh">
        <div><h1 data-t="rpTitle"></h1><p class="sub" data-t="rpSub"></p></div>
        <div class="seg" id="rangeSeg"></div>
      </div>
      <div class="grid g2">
        <div class="card"><div class="ch"><h2 data-t="srcTitle"></h2><span class="hint" id="srcHint"></span></div>
          <div class="cb"><div class="hb" id="srcChart"></div></div></div>
        <div class="card"><div class="ch"><h2 data-t="trendTitle"></h2><span class="hint" data-t="demoData"></span></div>
          <div class="cb"><div class="lg" id="trendLg"></div><div class="grp" id="trendChart"></div>
            <div class="gax" id="trendAxis"></div><p class="note" id="trendNote"></p></div></div>
      </div>
      <div class="grid g2">
        <div class="card"><div class="ch"><h2 data-t="funTitle"></h2><span class="hint" data-t="funHint"></span></div>
          <div class="cb"><div class="fun" id="funChart"></div></div></div>
        <div class="card"><div class="ch"><h2 data-t="qualTitle"></h2><span class="hint" data-t="qualHint"></span></div>
          <div class="cb"><div class="tw mid"><table id="tQual"><thead></thead><tbody></tbody></table></div></div></div>
      </div>
      <div class="card"><div class="ch"><h2 data-t="effTitle"></h2><span class="hint" data-t="effHint"></span></div>
        <div class="cb"><div class="tw"><table id="tEff"><thead></thead><tbody></tbody></table></div></div></div>
      <div class="tak" id="rpTake"></div>
    </section>

    <footer class="note" style="margin-top:34px;border-top:1px solid var(--line);padding-top:16px">
      <span data-t="footLegal"></span><br><b>Revisit</b> · <span data-t="footBy"></span> · <span data-t="footRepo"></span>
    </footer>
  </main>
</div>

<div class="tip" id="tip" role="status"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div id="drawerWrap" hidden>
  <div class="scrim" id="drawerScrim"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-label="client"></aside>
</div>

<div class="sheet" id="mAbout" hidden><div>
  <div class="mhd"><h2>Re<em style="font-family:var(--fd);font-style:italic;color:var(--accent)">visit</em></h2>
    <button class="xb" data-close="mAbout">✕</button></div>
  <p class="lead" id="aboutLead"></p>
  <div class="abgrid" id="aboutRows"></div>
  <div class="tak" id="aboutWarn" style="margin-bottom:16px"></div>
  <button class="btn blk" data-close="mAbout" id="aboutOk"></button>
</div></div>

<div class="sheet" id="mSet" hidden><div>
  <h2 data-t="setTitle"></h2><p class="lead" data-t="setLead"></p>
  <div class="field"><label for="iClinic" data-t="setClinic"></label><input class="inp" id="iClinic" maxlength="24"></div>

  var fb=[["fun1",CL.filter(function(c){return c.visits===1;}).length],
          ["fun2",CL.filter(function(c){return c.visits===2;}).length],
          ["fun3",CL.filter(function(c){return c.visits>=3&&c.visits<=5;}).length],
          ["fun6",CL.filter(function(c){return c.visits>=6;}).length]];
  var fmax=Math.max.apply(null,fb.map(function(x){return x[1];}))||1;
  $("funChart").innerHTML=fb.map(function(x){
    return '<div class="fnr"><span>'+t(x[0])+'</span><span class="tk"><span class="fl" style="width:'+
      Math.max(12,x[1]/fmax*100)+'%">'+x[1]+'</span></span>'+
      '<span class="rt">'+Math.round(x[1]/CL.length*100)+'%</span></div>';}).join("");

  $("tQual").querySelector("thead").innerHTML="<tr><th>"+t("th_src")+"</th><th class='n'>"+t("th_count")+
    "</th><th class='n'>"+t("th_avg")+"</th><th class='n'>"+t("th_active")+"</th><th class='n'>"+t("th_rate")+"</th></tr>";
  var qr=pairs.map(function(p){var n=p.n||1;
    return{s:tx(SRC[p.i]),n:p.n,avg:(q[p.i].v/n),a:q[p.i].a,r:Math.round(q[p.i].a/n*100)};})
    .sort(function(a,b){return b.r-a.r;});
  $("tQual").querySelector("tbody").innerHTML=qr.map(function(r){
    return "<tr><td>"+r.s+"</td><td class='n'>"+r.n+"</td><td class='n'>"+r.avg.toFixed(1)+
      "</td><td class='n'>"+r.a+"</td><td class='n'>"+r.r+"%</td></tr>";}).join("");

  $("tEff").querySelector("thead").innerHTML="<tr><th>"+t("th_rule")+"</th><th class='n'>"+t("th_sent")+
    "</th><th class='n'>"+t("th_reply")+"</th><th class='n'>"+t("th_booked")+"</th><th class='n'>"+t("th_conv")+"</th></tr>";
  var onR=RULES.filter(function(r){return r.on;});
  $("tEff").querySelector("tbody").innerHTML=onR.length?onR.map(function(r){
    return "<tr><td>"+tx(r.nm)+"</td><td class='n'>"+r.sent+"</td><td class='n'>"+r.rep+
      "</td><td class='n'>"+r.bk+"</td><td class='n'>"+(r.sent?Math.round(r.bk/r.sent*100):0)+"%</td></tr>";}).join(""):
    "<tr><td colspan='5' class='empty'>—</td></tr>";

  var best=qr[0],top=pairs[0],worst=qr[qr.length-1];
  $("rpTake").innerHTML=(best.s===tx(SRC[top.i]))
    ?t("takeaway2",{a:best.s,b:top.n,d:best.r,e:best.avg.toFixed(1),f:worst.s,g:worst.n,h:worst.r})
    :t("takeaway",{a:tx(SRC[top.i]),b:top.n,c:best.s,d:best.r,e:best.avg.toFixed(1)});
}
$("rangeSeg").addEventListener("click",function(e){var b=e.target.closest("[data-rg]");if(!b)return;
  rpRange=+b.dataset.rg;renderReports();});

/* ---------------- settings / about ---------------- */
function renderAbout(){
  $("aboutLead").textContent=t("aboutLead");
  $("aboutRows").innerHTML=["ab1","ab2","ab3"].map(function(k,i){
    return '<div class="abr"><span class="n">'+(i+1)+'</span><span>'+t(k)+'</span></div>';}).join("");
  $("aboutWarn").innerHTML=t("aboutWarn");
  $("aboutOk").textContent=t("ok");
}
$("btnAbout").addEventListener("click",function(){renderAbout();openM("mAbout");});
$("btnSet").addEventListener("click",function(){
  $("iClinic").value=tx(T.clinic);$("iDoc").value=tx(T.doc);$("iPhone").value=T.phone;
  $("saveSet").textContent=t("apply");openM("mSet");$("iClinic").focus();});
$("saveSet").addEventListener("click",function(){
  var v=$("iClinic").value.trim();if(v)T.clinic=[v,v];
  var d=$("iDoc").value.trim();if(d)T.doc=[d,d];
  var p=$("iPhone").value.trim();if(p)T.phone=p;
  closeM("mSet");resetMsgs();renderAll();toast(t("apply"));});

/* ---------------- shell wiring ---------------- */
function renderRail(){
  $("railClinic").textContent=tx(T.clinic);
  var rs=[["front","rFront"],["mkt","rMkt"],["owner","rOwner"]];
  $("roleSel").innerHTML=rs.map(function(r){
    return '<option value="'+r[0]+'"'+(ST.role===r[0]?" selected":"")+'>'+t(r[1])+'</option>';}).join("");
}
$("roleSel").addEventListener("change",function(){
  ST.role=this.value;clSel={};renderNav();
  if(perm().views.indexOf(ST.view)<0)go(perm().views[0]);else go(ST.view);
  renderAll();toast(t("roleLabel")+"："+t(ROLEN[ST.role]));});
function setLang(v){lang=v;ST.lang=v;applyI18n();renderLogin();resetMsgs();renderRail();renderAll();
  if(!$("mAbout").hidden)renderAbout();}
$("btnLang").addEventListener("click",function(){setLang(1-lang);});
$("langLogin").addEventListener("click",function(){setLang(1-lang);});
$("btnTheme").addEventListener("click",function(){
  var r=document.documentElement;
  var dark=r.getAttribute("data-theme")==="dark"||
    (!r.getAttribute("data-theme")&&window.matchMedia("(prefers-color-scheme: dark)").matches);
  r.setAttribute("data-theme",dark?"light":"dark");});
$("btnReset").addEventListener("click",function(){
  buildData();clSel={};rcSel={};TODO={};resetMsgs();renderAll();toast(t("resetDone"));});
$("btnExit").addEventListener("click",function(){$("app").hidden=true;$("login").hidden=false;window.scrollTo(0,0);});

function renderLogin(){
  var rs=[["front","rFront","rFrontD",'<path d="M4 20v-1.5A4.5 4.5 0 0 1 8.5 14h3A4.5 4.5 0 0 1 16 18.5V20"/><circle cx="10" cy="8" r="3.4"/><path d="M17 4h4v4"/>'],
          ["mkt","rMkt","rMktD",'<path d="M4 9v6h3l6 4V5L7 9z"/><path d="M17 9.5a4 4 0 0 1 0 5"/>'],
          ["owner","rOwner","rOwnerD",'<path d="M4 18h16"/><path d="M5 15l-1-7 4.5 3L12 5l3.5 6L20 8l-1 7z"/>']];
  $("roleCards").innerHTML=rs.map(function(r){
    return '<button class="rolecard" data-role="'+r[0]+'"><span class="ri"><svg viewBox="0 0 24 24">'+r[3]+
      '</svg></span><h3>'+t(r[1])+'</h3><p>'+t(r[2])+'</p></button>';}).join("");
}
$("roleCards").addEventListener("click",function(e){
  var b=e.target.closest("[data-role]");if(!b)return;
  ST.role=b.dataset.role;
  $("login").hidden=true;$("app").hidden=false;
  renderRail();renderNav();renderAll();go(perm().views[0]);
  if(!window.__abShown){window.__abShown=1;renderAbout();setTimeout(function(){openM("mAbout");},260);}
});

function renderAll(soft){
  renderRail();renderNav();renderOverview();renderClients();renderRecall();renderAuto();renderReviews();
  if(!soft||ST.view==="ap")renderCal();
  if(ST.view==="rp")renderReports();
  ["saveNa","saveNc","saveRu"].forEach(function(i){$(i).textContent=t("save");});
  document.querySelectorAll('[data-close="mSet"],[data-close="mNewAp"],[data-close="mNewCl"],[data-close="mRule"]')
    .forEach(function(b){if(b.classList.contains("sec"))b.textContent=t("cancel");});
}

/* ---------------- boot ---------------- */
applyI18n();buildData();resetMsgs();renderLogin();renderRail();
})();
</script>
</body>
